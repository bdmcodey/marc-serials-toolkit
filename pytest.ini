[pytest]
minversion = 8.0
testpaths = tests

addopts =
    -ra
    --strict-markers
    --strict-config

# ai-regex/test_enum_update.py matches test_*.py but is a hand-run CLI script,
# not a test: it imports tkinter.filedialog and four sibling modules at module
# level and fails during collection. testpaths alone does not protect against
# someone running `pytest <path>`, so the directory is excluded outright.
norecursedirs =
    ai-regex
    pnx-lookup
    deploy
    .venv
    .git
    */templates
    */__pycache__

markers =
    calibration: pins exact counts against the private USC corpus; skips cleanly when it is unavailable
