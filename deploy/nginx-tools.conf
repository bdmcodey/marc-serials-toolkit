# tools.matthewcodey.com — reverse proxy for the two web tools.
# Place in /etc/nginx/sites-available/tools, symlink into sites-enabled,
# then run: sudo certbot --nginx -d tools.matthewcodey.com  (adds the 443 block).

server {
    listen 80;
    listen [::]:80;
    server_name tools.matthewcodey.com;

    # allow the tools' file uploads (matches the apps' 25 MB cap)
    client_max_body_size 25m;

    location = / { return 302 /converter/; }

    # Converter (gunicorn on :8001). Trailing slashes strip the /converter prefix.
    location = /converter { return 301 /converter/; }
    location /converter/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pattern Detector (gunicorn on :8002).
    location = /patterns { return 301 /patterns/; }
    location /patterns/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
