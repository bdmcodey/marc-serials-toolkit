# tools.matthewcodey.com — reverse proxy for the two web tools.
# Place in /etc/nginx/sites-available/tools, symlink into sites-enabled,
# then run: sudo certbot --nginx -d tools.matthewcodey.com  (adds the 443 block).

# Rate limit: cap each client IP to ~10 req/s with a short burst of 20, and
# return 429 when exceeded. limit_req_zone must live in nginx's http context —
# it does here, because nginx includes this file from inside its http block.
# (If you apply the limit on the live server via /etc/nginx/conf.d instead,
# don't also keep this line, or the zone will be defined twice.)
limit_req_zone $binary_remote_addr zone=tools:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name tools.matthewcodey.com;

    # allow the tools' file uploads (matches the apps' 25 MB cap)
    client_max_body_size 25m;

    location = / { return 302 /converter/; }

    # Converter (gunicorn on :8001). Trailing slashes strip the /converter prefix.
    location = /converter { return 301 /converter/; }
    location /converter/ {
        limit_req zone=tools burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pattern Detector (gunicorn on :8002).
    location = /patterns { return 301 /patterns/; }
    location /patterns/ {
        limit_req zone=tools burst=20 nodelay;
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
